<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070c19" />
    <meta name="description" content="KPL 2K 与 KPL Guessing 游戏入口" />
    <link rel="icon" type="image/png" href="./assets/brand/kpl2k-avatar-v1.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>KPL 游戏中心</title>
  </head>
  <body>
    <main class="hub">
      <header class="hero">
        <p class="eyebrow"><span></span>KPL GAME HUB<span></span></p>
        <h1>选择你的赛场</h1>
        <p>经营一支王朝战队，或挑战你的 KPL 人物知识。</p>
      </header>

      <section class="game-grid" aria-label="游戏入口">
        <a class="game-card game-card--red" href="./kpl2k/">
          <span class="card-glow" aria-hidden="true"></span>
          <span class="avatar-wrap">
            <img src="./assets/brand/kpl2k-avatar-v1.png" alt="KPL 2K 图标" />
          </span>
          <span class="card-copy">
            <span class="game-type">战队经营</span>
            <strong>KPL 2K</strong>
            <span class="game-desc">平行时空战队经理</span>
          </span>
          <span class="enter">进入游戏 <b aria-hidden="true">→</b></span>
        </a>

        <a class="game-card game-card--blue" href="./guessing/">
          <span class="card-glow" aria-hidden="true"></span>
          <span class="avatar-wrap">
            <img src="./assets/brand/kpl-guessing-avatar-v1.png" alt="KPL Guessing 图标" />
          </span>
          <span class="card-copy">
            <span class="game-type">人物竞猜</span>
            <strong>KPL Guessing</strong>
            <span class="game-desc">弗一把 · KPL天才 · 人物图鉴</span>
          </span>
          <span class="enter">进入游戏 <b aria-hidden="true">→</b></span>
        </a>
      </section>
    </main>
  </body>
</html>
